<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-placeholder">🔧</div>
      <h2>DigitalFix</h2>
      <p>Portal de Gestión de Órdenes</p>
    </div>

    <!-- Formulario visual provisional -->
    <form (ngSubmit)="onMockLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@digitalfix.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary">Ingresar al Sistema</button>
    </form>

    <div class="divider">
      <span>O</span>
    </div>

    <!-- Botón que posteriormente ejecutará el flujo de MSAL -->
    <button type="button" class="btn-microsoft" (click)="onMicrosoftLogin()">
      <img src="https://learn.microsoft.com/en-us/entra/identity-platform/media/howto-add-branding-in-apps/ms-symbollockup_mssymbol_19.svg" alt="Microsoft Logo">
      Iniciar sesión con Microsoft Entra ID
    </button>
  </div>
</div>
