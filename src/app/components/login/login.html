<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-placeholder">🔧</div>
      <h2>DigitalFix</h2>
      <p>Portal de Gestión de Órdenes</p>
    </div>

    <div class="login-security-notice">
      <p>Acceso restringido a personal autorizado. Inicie sesión con su cuenta corporativa para acceder al sistema.</p>
    </div>

    <!-- Botón oficial de autenticación segura con Microsoft Entra ID -->
    <button type="button" class="btn-microsoft" (click)="onMicrosoftLogin()">
      <img src="https://learn.microsoft.com/en-us/entra/identity-platform/media/howto-add-branding-in-apps/ms-symbollockup_mssymbol_19.svg" alt="Microsoft Logo">
      Iniciar sesión con Microsoft Entra ID
    </button>
  </div>
</div>
