<div class="dashboard-layout">
  <!-- MENÚ LATERAL PERSISTENTE -->
  <aside class="sidebar" [class.collapsed]="!sidebarOpen">
    <div class="brand">
      <div class="brand-title">
        <span class="icon">🔧</span>
        <h2>DigitalFix</h2>
      </div>
      <button class="btn-close-sidebar" (click)="toggleSidebar()" title="Contraer menú">✕</button>
    </div>

    <nav class="menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">📊 Dashboard (KPIs)</a>
      <a routerLink="/workorders" routerLinkActive="active" class="menu-item">📋 Órdenes de Trabajo</a>
      <a routerLink="/catalog" routerLinkActive="active" class="menu-item" *ngIf="userRole !== 'CLIENTE'">📦 Catálogo y Repuestos</a>
    </nav>

    <div class="user-profile">
      <div class="avatar">👤</div>
      <div class="info">
        <p class="email">{{ userName || 'Usuario' }}</p>
        <span class="badge" [ngClass]="userRole.toLowerCase()">Rol: {{ userRole }}</span>
      </div>
      
      <!-- Selector de rol -->
      <select class="role-selector" (change)="cambiarRolSimulado($event)">
        <option value="SUPERVISOR" [selected]="userRole === 'SUPERVISOR'">Probar como Supervisor</option>
        <option value="ADMIN" [selected]="userRole === 'ADMIN'">Probar como Admin</option>
        <option value="CLIENTE" [selected]="userRole === 'CLIENTE'">Probar como Cliente</option>
      </select>

      <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
      <button class="btn-bff" (click)="probarBff()">🚀 Probar Conexión BFF</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">
    <header class="topbar">
      <!-- BOTÓN HAMBURGUESA PERSISTENTE EN TODAS LAS PÁGINAS -->
      <button class="hamburger-btn" (click)="toggleSidebar()" title="Abrir/Cerrar menú lateral">
        ☰
      </button>

      <div class="topbar-info">
        <h1>DigitalFix</h1>
        <p>Sistema Integral de Órdenes de Trabajo y Catálogo</p>
      </div>
    </header>

    <!-- AQUÍ SE CARGAN DINÁMICAMENTE TODAS LAS VISTAS (Dashboard, Catálogo, Órdenes) -->
    <div class="router-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
